[package]
name = "genc3wb"
version = "0.8.0"
edition = "2024"
description = "The workbench of the meta compiler-compiler genc³: edits a compiler network and the files of its nodes, lets the build system serve them, and presents their outputs."

[lib]
name = "genc3wb"
path = "src/lib.rs"

[[bin]]
name = "genc3wb"
path = "src/main.rs"

[dependencies]
qtbridge = "0.2"
ciborium = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
